[project]
name = "readhold"
version = "0.1.0"
description = "Local-first reader that gives every long text a map, keeps you active while reading, and turns reading into notes and memory."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.5",
    "starlette==1.10.0",  # pinned on its own: fixes advisories in 0.49 (checked with OSV on 2026-11-26)
    "uvicorn==0.34.2",
    "python-multipart==0.0.33",
    "mistune==3.4.0",
    "fsrs==5.1.3",
    "wordfreq==3.1.1",
    "lxml==6.1.3",
    "pywebview==5.4",
    "pypdfium2==5.15.0",
    "pillow==13.0.0",
    "python-pptx==1.0.2",
    "httpx==0.28.1",
    "keyring==25.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "reportlab==5.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
